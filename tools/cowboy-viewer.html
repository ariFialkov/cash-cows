<!doctype html>
<html><head><meta charset="utf-8"><title>cowboy viewer</title>
<style>body{margin:0;background:#9fb8c8}canvas{display:block}</style></head>
<body>
<script type="module">
// Dev tool: renders a skinned cowboy, either standing in its bind pose
// (?stand=1, front/side/back, ?debug=1 colours by bone group) or mounted on
// a horse in the riding pose (?species=quarter&pose=spin&speed=4).
import * as THREE from 'three';
import { getSpecies } from '/src/game/horses.js';
import { loadHorseType, SkinnedHorseRider } from '/src/entities/horseModel.js';
import { loadCowboy, SkinnedCowboy, randomOutfit, playerOutfit, paintOutfit } from '/src/entities/cowboyModel.js';

const q = new URLSearchParams(location.search);
const idx = parseInt(q.get('cowboy') || '0');
const stand = q.get('stand') === '1';
const debug = q.get('debug') === '1';
const speed = parseFloat(q.get('speed') || '0');
const pose = q.get('pose') || 'rest';
const FR = stand ? 3 : parseInt(q.get('frames') || '3'), W = parseInt(q.get('w') || '300'), H = 500;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W * FR, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb8c8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(3, 5, 2); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x6a9a4a }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);
renderer.setScissorTest(true);
const snap = (i) => { renderer.setViewport(i * W, 0, W, H); renderer.setScissor(i * W, 0, W, H); renderer.render(scene, camera); };

const ct = await loadCowboy(idx);
const outfit = q.get('random') === '1' ? randomOutfit() : playerOutfit(idx, {});
const groundMode = q.get('ground');
if (groundMode) {
  // off-horse poses: ?ground=roped|tantrum|dustoff|jog|mount&span=2
  const cb = new SkinnedCowboy(ct, outfit);
  scene.add(cb.group);
  const span = parseFloat(q.get('span') || '2'), dt = 1 / 60;
  const limb = { kind: q.get('limb') || 'hand', side: q.get('side') || 'Right' };
  camera.position.set(4.5, 2.0, 4.0); camera.lookAt(0, 0.7, 0);
  let t = 0;
  const place = () => {
    if (groundMode === 'roped') {
      const f = limb.kind === 'hand' ? 1 : -1;
      const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(-f, 0, 0), new THREE.Vector3(0, 0, f), new THREE.Vector3(0, 1, 0));
      cb.group.quaternion.setFromRotationMatrix(m); cb.group.position.set(0, 0.16, 0);
    } else if (groundMode === 'tantrum') { cb.group.quaternion.identity(); cb.group.position.set(0, 0.1, 0); }
    else { cb.group.quaternion.identity(); cb.group.position.set(0, cb.hipsHeight - 0.02, 0); }
  };
  for (let i = 0; i < FR; i++) {
    const until = t + span / FR;
    while (t < until) { place(); cb.groundPose(groundMode, t, dt, { walk: 1, phase: t * 2 * Math.PI * 2.6, speed: 0.8, jerk: Math.max(0, Math.sin(t * 4)), kick: Math.max(0, Math.sin(t * 3 + 1)), kickSide: 1, limb }); cb.floorClamp(() => 0, 0.04); t += dt; }
    snap(i);
  }
} else if (stand) {
  const cb = new SkinnedCowboy(ct, outfit);
  if (debug) paintOutfit(cb.mesh, outfit, ct.cowboy, ct, true);
  // undo the riding pose: bind pose, feet on the ground
  cb.model.traverse((o) => { if (o.isBone) { const d = ct.boneData.get(o.name); if (d) o.quaternion.copy(d.rest); } });
  cb.model.position.set(0, -ct.groundY * ct.S, 0);
  scene.add(cb.group); window.__cb = cb; window.__ct = ct; window.__THREE = THREE;
  const views = [[0, 1, 6.5], [6.5, 1, 0], [0, 1, -6.5]];
  views.forEach((p, i) => { camera.position.set(...p); camera.lookAt(0, 0.9, 0); snap(i); });
  window.__done = { paint: paintOutfit.lastInfo };
} else {
  const species = getSpecies(q.get('species') || 'quarter');
  const template = await loadHorseType(species.type);
  const rig = new SkinnedHorseRider(template, species, 0);
  rig.mountCowboy(new SkinnedCowboy(ct, outfit));
  scene.add(rig.group);
  const dt = 1 / 120; let t = 0;
  // settle in the 'from' pose, then switch to the requested pose and capture
  // FR frames across `span` seconds (a filmstrip of the transition / cycle)
  const from = q.get('from') || 'rest', span = parseFloat(q.get('span') || '0');
  const look = q.get('look') === '1' ? new THREE.Vector3(3, 0.6, -4) : null;
  rig.lookTarget = look;
  let spin = 0;
  const step = (p) => { spin += dt * 7.5; rig.lassoAngle = spin; rig.animate(dt, speed, 0, p, t); rig.postPose(); t += dt; };
  for (let i = 0; i < 120 * 4; i++) step(from);
  const views = span > 0 ? null : [[7.5, 1.4, 0.1], [5.0, 1.8, 5.0], [0.1, 1.5, 7.5]];
  if (views) {
    for (let i = 0; i < 120 * 2; i++) step(pose);
    views.forEach((p, i) => { step(pose); camera.position.set(...p); camera.lookAt(0, 1.2, 0.1); snap(i); });
  } else {
    camera.position.set(5.2, 1.9, 4.6); camera.lookAt(0, 1.3, 0.1);
    for (let i = 0; i < FR; i++) { const until = t + span / FR; while (t < until) step(pose); snap(i); }
  }
  const hand = rig.handWorldPos(new THREE.Vector3());
  window.__done = { hand: hand.toArray().map((v) => +v.toFixed(2)), paint: paintOutfit.lastInfo };
}
document.title = 'done';
</script></body></html>
